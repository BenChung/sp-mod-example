name: Release mod
 
on:
  push:
    tags: ["v*"]
 
permissions:
  contents: write      # for the release upload below
  id-token: write      # required by attest-mod (Sigstore certificate)
  attestations: write  # required by attest-mod (store attestation on GitHub)
 
jobs:
  build-and-attest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
 
      # --- modder-controlled build; anything goes here --------------------
      - run: mkdir my-mod
      - run: cp README.md my-mod/
      # ----------------------------------------------------------------------
 
      # Provenance embed. my-mod/ is the Workshop item content folder.
      - name: Attest mod folder
        id: attest
        uses: BenChung/sp-mod-attestation@v1.1.0
        with:
          path: my-mod
 
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r -X "my-mod-${GITHUB_REF_NAME}.zip" my-mod   # extracts to my-mod/...
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber "my-mod-${GITHUB_REF_NAME}.zip"